name: Bug report
description: Report a reproducible problem
labels: ["bug"]
body:
  - type: textarea
    id: reproduction
    attributes: { label: Reproduction, description: Provide a minimal decision or test case. }
    validations: { required: true }
  - type: textarea
    id: logs
    attributes:
      { label: Logs, description: Remove prompts, responses, credentials and personal data. }
