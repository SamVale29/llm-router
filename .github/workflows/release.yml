name: Release
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.12.1 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:check
      - run: pnpm catalog:build
      - run: pnpm changeset publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: git archive --format=tar.gz --output=llm-router-${{ github.ref_name }}.tar.gz HEAD
      - uses: softprops/action-gh-release@v2
        with:
          name: LLM Router ${{ github.ref_name }} — Explainable model routing
          body_path: RELEASE_NOTES.md
          files: |
            llm-router-${{ github.ref_name }}.tar.gz
